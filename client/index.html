<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA: "Adicionar à Tela de Início". iOS ignores the manifest icons for
         the home screen, hence the separate apple-touch-icon (180x180, full
         bleed — iOS applies its own mask). Icons are the Sidebar "ST" mark -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="SoTreina" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default", not "black-translucent": translucent forces white status
         bar text, unreadable over the light-theme app bar (bg-card) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="theme-color"
      content="#f5f6f8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b0f17"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>SoTreina</title>
    <meta
      name="description"
      content="SoTreina — analytics de treino pessoal. Sincronize suas corridas do Strava e acompanhe volume, carga de treino, zonas de FC e recordes pessoais."
    />
    <meta property="og:title" content="SoTreina" />
    <meta
      property="og:description"
      content="Analytics de treino pessoal. Sincronize suas corridas do Strava e acompanhe volume, carga de treino, zonas de FC e recordes pessoais."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sotreina.com" />
    <meta property="og:site_name" content="SoTreina" />
    <!--
      CSP: the inline script below is allowlisted by sha256 hash in vercel.json
      (script-src). Any byte change to it (even whitespace) breaks it in prod —
      recompute with `npm run csp:hash` and update vercel.json accordingly.
    -->
    <script>
      // apply persisted theme before first paint to avoid flash; anything
      // other than an explicit manual choice means "auto" (follow the browser)
      (function () {
        var pref = localStorage.getItem('theme');
        if (
          pref === 'dark' ||
          (pref !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        }
      })();
      // set <html lang> before first paint, same rule as client/src/i18n/index.ts
      (function () {
        var stored = localStorage.getItem('language');
        var lang =
          stored === 'pt' || stored === 'en'
            ? stored
            : (navigator.language || '').toLowerCase().indexOf('pt') === 0
              ? 'pt'
              : 'en';
        document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en-US';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
